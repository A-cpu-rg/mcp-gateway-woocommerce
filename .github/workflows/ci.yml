name: ci
on:
  push:
  pull_request:

jobs:
  code:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gw
          POSTGRES_PASSWORD: gw
          POSTGRES_DB: gw
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gw" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gw:gw@localhost:5432/gw
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

