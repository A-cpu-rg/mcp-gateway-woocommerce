{{- if .Values.stores.enabled }}
# store-provisioner: the only component that talks to the Kubernetes API. Not exposed (no Service, no
# Ingress, NetworkPolicy allows no ingress). The gateway itself has no Kubernetes credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
---
# Least privilege. Store namespaces are created at runtime, so the provisioner holds a small cluster-wide role:
# manage namespaces, and create RoleBindings that may only grant the tenant role below. Everything a store
# needs inside its namespace comes from that tenant role, which the provisioner binds to itself in each
# store-<slug> namespace it creates (kube.ts ensureAccess). It has no rights at all in platform, kube-system
# or any other namespace. The admission policy further down restricts the namespace/RoleBinding writes to
# store-*; the code also refuses other names and never deletes a namespace it did not label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, delete]
  # Kubernetes only lets a subject create a RoleBinding to a role it may "bind" (or already holds).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [{{ .Release.Namespace }}-store-tenant]
---
# What one store needs inside its own namespace: the kinds the store chart creates, Helm's release records
# (ConfigMaps: the provisioner runs Helm with HELM_DRIVER=configmap) and what `helm --wait` watches. Never
# bound cluster-wide; only through a RoleBinding in a store namespace.
# Secrets: the provisioner creates the four store Secrets and reads back only the MCP token it registers the
# store with. It cannot list, read, update or delete any other Secret. Note what this does NOT stop: whoever
# may create Deployments in a namespace can start a Pod that mounts that namespace's Secrets, so a compromised
# provisioner can still reach every store's Secrets that way (see docs/threat-model.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-store-tenant
  labels: {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [woocommerce-mcp-auth]
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-store-provisioner
subjects:
  - kind: ServiceAccount
    name: store-provisioner
    namespace: {{ .Release.Namespace }}
{{- if .Values.provisioner.admissionPolicy }}
---
# RBAC cannot express "only namespaces named store-*". This policy does, for requests made by the
# provisioner: namespaces it creates must be store-* and carry the store labels (the gateway's egress policy
# keys on them); namespaces it deletes must be store-* AND carry a store-id label, i.e. have been created as a
# store, so it cannot delete an unrelated store-* namespace; RoleBindings only in store-* namespaces, only to
# the tenant role, only for itself. Residual (documented): it can still delete ANY store's namespace; RBAC and
# CEL cannot tie a delete to the one store row being reconciled.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
  matchConditions:
    - name: store-provisioner-only
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:store-provisioner'"
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' ||
        (request.operation == 'DELETE' ? oldObject : object).metadata.name.startsWith('store-')
      message: the store-provisioner may only create or delete store-* namespaces
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'urumi.io/store-id' in object.metadata.labels &&
         object.metadata.labels['urumi.io/store'] == 'true')
      message: namespaces created by the store-provisioner must carry the urumi.io/store and store-id labels
    # Pod Security baseline, so the workloads it may create there cannot be privileged or mount the host. It
    # cannot relabel a namespace afterwards (no update/patch on namespaces).
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'])
      message: namespaces created by the store-provisioner must enforce Pod Security baseline or restricted
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'DELETE' ||
        (has(oldObject.metadata.labels) && 'urumi.io/store-id' in oldObject.metadata.labels)
      message: the store-provisioner may only delete namespaces it created as stores (urumi.io/store-id label)
    - expression: "request.resource.resource != 'rolebindings' || request.namespace.startsWith('store-')"
      message: the store-provisioner may only manage RoleBindings in store-* namespaces
    - expression: >-
        request.resource.resource != 'rolebindings' || request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' &&
         object.roleRef.name == '{{ .Release.Namespace }}-store-tenant' &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'store-provisioner' &&
           s.namespace == '{{ .Release.Namespace }}'))
      message: the store-provisioner may only bind the store tenant role to itself
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Namespace }}-store-provisioner
  validationActions: [Deny]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-provisioner
spec:
  replicas: 1
  # Work is leased in Postgres, so two pods would be safe; Recreate just avoids needless overlap.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: store-provisioner }
  template:
    metadata:
      labels: {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-provisioner
    spec:
      serviceAccountName: store-provisioner
      automountServiceAccountToken: true
      securityContext: {{- include "platform.podSecurity" . | nindent 8 }}
      containers:
        - name: store-provisioner
          image: {{ .Values.provisioner.image }}
          imagePullPolicy: {{ .Values.provisioner.pullPolicy }}
          securityContext: {{- include "platform.restricted" . | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres }}, key: POSTGRES_PASSWORD } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.gateway }}, key: ENCRYPTION_KEY } }
            - { name: DATABASE_URL, value: "postgres://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway" }
            - { name: GATEWAY_NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: SERVICE_ACCOUNT_NAME, value: store-provisioner }
            - { name: STORE_TENANT_ROLE, value: "{{ .Release.Namespace }}-store-tenant" }
            - { name: STORE_CHART_DIR, value: /app/charts/store }
            - { name: STORE_VALUES_FILE, value: "/app/charts/store/{{ .Values.provisioner.storeValuesFile }}" }
            - { name: PROVISION_CONCURRENCY, value: {{ .Values.stores.concurrency | quote }} }
            - { name: UPSTREAM_ALLOWED_HOSTS, value: {{ .Values.gateway.upstreamAllowedHosts | quote }} }
            - { name: HOME, value: /tmp }
            # Release records in ConfigMaps, so the tenant role needs no Secret reads (kube.ts sets it too).
            - { name: HELM_DRIVER, value: configmap }
            - { name: HELM_CACHE_HOME, value: /tmp/helm/cache }
            - { name: HELM_CONFIG_HOME, value: /tmp/helm/config }
            - { name: HELM_DATA_HOME, value: /tmp/helm/data }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.provisioner.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-provisioner
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: store-provisioner } }
  policyTypes: ["Ingress", "Egress"]
  ingress: []   # nothing calls the provisioner
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ port: 5432 }]
    # The Kubernetes API server only. Policies see the address after the Service is resolved, i.e. the API
    # server's endpoint (k3s: the node IP, port 6443). `make deploy-*` passes it from the EndpointSlice.
    - to: [{ ipBlock: { cidr: {{ required "provisioner.apiServerCidr: the API server endpoint, e.g. 172.20.0.3/32 (kubectl get endpointslice -l kubernetes.io/service-name=kubernetes)" .Values.provisioner.apiServerCidr | quote }} } }]
      ports: [{ port: 443 }, { port: 6443 }]
{{- end }}
